# Noćni dohvat EFFIS FWI-ja za točke naselja → web/public/data/fwi_today.json.
# Commit pokreće pages.yml, pa karta svako jutro ima svjež indeks opasnosti.
name: nightly_fwi

on:
  schedule:
    - cron: "15 4 * * *"   # 04:15 UTC ≈ 05:15/06:15 po lokalnom vremenu
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fwi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy rasterio geopandas pandas
      - run: python -m etl.fwi_today
      - name: Commit fwi_today.json
        run: |
          git config user.name "jedan-izlaz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data/fwi_today.json
          git diff --staged --quiet || git commit -m "Osvježi EFFIS FWI ($(date -u +%F))"
          git push

  # Push koji napravi GITHUB_TOKEN ne pokreće druge workflowe, pa Pages objavljujemo ovdje.
  deploy:
    needs: fwi
    uses: ./.github/workflows/pages.yml
